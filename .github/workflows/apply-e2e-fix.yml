name: apply-e2e-fix

on:
  push:
    paths:
      - .github/workflows/apply-e2e-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: let the bench answer, and discuss evidence
        run: |
          git apply --check .github/e2e_fix.patch
          git apply --whitespace=nowarn .github/e2e_fix.patch
          python3 - <<'PY'
          import ast, pathlib
          for p in ["main.py", "llm.py", "tests/test_chat_engineering_route.py"]:
              ast.parse(pathlib.Path(p).read_text())
              print(p, "parses")
          PY

      - name: commit and push
        run: |
          git config user.name "idris-bot"
          git config user.email "noreply@github.com"
          git add -A
          git commit -m "fix(chat): the bench answers first, evidence is discussed" -m "A bolt question was answered by the standard-parts library and the bench never ran; a part question with evidence came back as HTTP 502 because the requirements reader was asked for JSON."
          git push
