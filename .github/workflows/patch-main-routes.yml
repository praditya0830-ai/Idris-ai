name: patch-main-routes

on:
  push:
    paths:
      - .github/workflows/patch-main-routes.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: allow the two new engine routes through the POST gate
        run: |
          python3 - <<'PY'
          path = "main.py"
          src = open(path, encoding="utf-8").read()
          old = '"/model/validate", "/assembly/manifest", "/exchange/step")'
          new = ('"/model/validate", "/model/build", "/assembly/manifest", "/assembly/node",\n'
                 '                       "/exchange/step")')
          found = src.count(old)
          assert found == 1, f"anchor matched {found} times: refusing to guess"
          open(path, "w", encoding="utf-8").write(src.replace(old, new))
          print("anchor replaced once")
          PY
          git diff --stat

      - name: commit and push
        run: |
          git config user.name "idris-bot"
          git config user.email "noreply@github.com"
          git add main.py
          if git diff --cached --quiet; then
            echo "already patched; nothing to do"
            exit 0
          fi
          git commit -m "feat(api): let /model/build and /assembly/node through the POST route gate"
          git push
