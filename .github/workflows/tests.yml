name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  fast:
    name: Fast solver + API tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      # cadquery-ocp is optional: the OCCT tests exercise the documented fallback path.
      - run: pip install numpy scipy pytest
      - name: pytest (fast subset)
        run: |
          pytest -q \
            tests/test_iso6336.py \
            tests/test_routes.py \
            tests/test_references.py \
            tests/test_reference_additions.py \
            tests/test_bearing_life.py \
            tests/test_gear_report.py \
            tests/test_design_methods.py \
            tests/test_variants_mvp.py \
            tests/test_edit_variant.py \
            tests/test_catalog.py \
            tests/test_power_loss.py \
            tests/test_llm_nvidia.py \
            tests/test_llm_salvage.py \
            tests/test_report.py \
            tests/test_engineer.py \
            tests/test_engineer_routes.py \
            tests/test_fea_bench.py \
            tests/test_review_and_gear.py \
            tests/test_chat_engineering_route.py \
            tests/test_design_ladder.py \
            tests/test_feature_recipe.py \
            tests/test_fea_worker.py \
            tests/test_fea3d_client.py

  full:
    name: Full suite (manual)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: pytest

  fea-worker:
    name: FEA worker container (/health, /capabilities)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Build the worker image
        run: docker build -f fea_worker/Dockerfile -t idris-fea:ci .
      # FEA_RUN_BENCHMARKS=0 keeps this smoke build short: capabilities then honestly
      # report validated:false, which is exactly what the probe below expects.
      - name: Start the container and probe it
        run: |
          docker run -d --name fea -e FEA_WORKER_TOKEN=ci-token -e FEA_RUN_BENCHMARKS=0 -p 8080:8080 idris-fea:ci
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:8080/health && break || sleep 2; done
          curl -fsS http://127.0.0.1:8080/health | tee /tmp/health.json
          curl -fsS -H "Authorization: Bearer ci-token" http://127.0.0.1:8080/capabilities | tee /tmp/caps.json
          python3 - <<'EOF'
          import json
          caps = json.load(open("/tmp/caps.json"))
          assert caps["worker"] == "idris-fea", caps
          assert "analyses" in caps and "limits" in caps
          assert json.load(open("/tmp/health.json"))["ok"] is True
          print("capabilities ok:", sorted(caps["analyses"]))
          EOF
          docker logs fea
