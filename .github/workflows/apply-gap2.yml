name: apply-gap2

on:
  push:
    paths:
      - .github/workflows/apply-gap2.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: gear topic, review lines, lessons
        run: |
          git apply --check .github/gap2.patch
          git apply --whitespace=nowarn .github/gap2.patch
          python3 - <<'PY'
          import ast, pathlib
          ast.parse(pathlib.Path("ai/engineer.py").read_text())
          print("ai/engineer.py parses")
          PY

      - name: commit and push
        run: |
          git config user.name "idris-bot"
          git config user.email "noreply@github.com"
          git add -A
          git commit -m "feat(engine): ISO 6336 gear pair, REVIEW lines, four more lessons" -m "The bench rates a gear pair through physics/iso6336.py and asks for K_Hbeta and sigma_Hlim instead of defaulting them; teach() covers hole, wall, pattern and draft with real ribbon tools."
          git push
