name: apply-engine5

on:
  push:
    paths:
      - .github/workflows/apply-engine5.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: make the advice consistent with the result
        id: patch
        continue-on-error: true
        run: |
          git apply --check .github/fix5.patch
          git apply --whitespace=nowarn .github/fix5.patch
          python3 - <<'PY'
          import ast, pathlib
          for p in ["ai/fea.py", "tests/test_fea_bench.py"]:
              ast.parse(pathlib.Path(p).read_text())
              print(p, "parses")
          PY
          git config user.name "idris-bot"
          git config user.email "noreply@github.com"
          git add -A
          git commit -m "fix(engine): only offer the stiffness read when the part survives" -m "A part below yield gets stiffness advice; a part above yield gets told it failed."
          git push
