name: apply-gap1

on:
  push:
    paths:
      - .github/workflows/apply-gap1.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: wire the review into the solver and the route
        run: |
          git apply --check .github/gap1.patch
          git apply --whitespace=nowarn .github/gap1.patch
          python3 - <<'PY'
          import ast, pathlib
          for p in ["ai/fea.py", "ace_core/analysis.py", "ai/review.py"]:
              ast.parse(pathlib.Path(p).read_text())
              print(p, "parses")
          PY

      - name: commit and push
        run: |
          git config user.name "idris-bot"
          git config user.email "noreply@github.com"
          git add -A
          git commit -m "feat(engine): review the part with the same rules the plan names" -m "fea returns review[], /part-check attaches the same findings, and explicit supports/loads are solved as sent."
          git push
