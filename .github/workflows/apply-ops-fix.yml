name: apply-ops-fix

on:
  push:
    paths:
      - .github/ops-fix.patch

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: apply the verified patch
        run: |
          git apply --check .github/ops-fix.patch
          git apply --whitespace=nowarn .github/ops-fix.patch
          git diff --stat

      - name: commit and push
        run: |
          git config user.name "idris-bot"
          git config user.email "noreply@github.com"
          git add -A ':!.github'
          git commit -m "fix(model): every documented sketch profile and op actually works

          Fillet never ran (the edge was not downcast), draft died on BRepTools.OuterWire, a linear
          pattern of separate copies was rejected as not one solid, and revolve around an axis
          perpendicular to the sketch plane produced a broken body.

          Sketches also gain a polygon side count, triangle, lshape and an offset that puts them inside
          the model instead of only on the plane. Applied from a patch verified to reproduce the
          locally tested files byte for byte."
          git push
