name: apply-thinking-fix

on:
  push:
    paths:
      - .github/workflows/apply-thinking-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: thinking off for the OpenAI-compatible providers
        run: |
          git apply --check .github/thinking_fix.patch
          git apply --whitespace=nowarn .github/thinking_fix.patch
          python3 -c "import ast,pathlib; [ast.parse(pathlib.Path(p).read_text()) for p in ['llm.py','tests/test_providers_compat.py']]; print('parses')"

      - name: commit and push
        run: |
          git config user.name "idris-bot"
          git config user.email "noreply@github.com"
          git add -A
          git commit -m "feat(llm): switch thinking off so DeepSeek, Qwen and Kimi answer" -m "Their newest models spend the token budget on reasoning and return empty JSON; Kimi K3 cannot switch it off and gets room instead."
          git push
